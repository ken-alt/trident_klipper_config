# VORON TRIDENT 250mm — Octopus Pro / EBBCan


#####################################################################
# Bed Heater — Voron Trident 250mm
# Octopus Pro: heater on PA3 (HE1), thermistor on PF3 (TB)
#####################################################################

[heater_bed]
heater_pin: PA3
sensor_type: Generic 3950
sensor_pin: PF3
max_power: 0.6
min_temp: 10
max_temp: 125
pwm_cycle_time: 0.0167
# PID values managed by SAVE_CONFIG block in printer.cfg
# Run PID_CALIBRATE HEATER=heater_bed TARGET=100 then SAVE_CONFIG to update

[verify_heater heater_bed]
max_error: 180          # was 120 — more headroom for cold-start heating to 110C
check_gain_time: 120    # was 90 — gives heater more time to show gain on a cold soak
hysteresis: 5
heating_gain: 2

[verify_heater extruder]
check_gain_time: 40     # Extended from default 20s — prevents false "heating slowly" warning on cold-start ramp

