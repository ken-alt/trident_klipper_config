# VORON TRIDENT 250mm — Octopus Pro / EBBCan


#####################################################################
#   Fan Control
#####################################################################

[fan]
# Print Cooling Fan
pin: EBBCan: PA1
kick_start_time: 0.5
off_below: 0.10

[heater_fan hotend_fan]
pin: EBBCan: PA0
max_power: 1.0
kick_start_time: 0.5
heater: extruder
heater_temp: 50.0

[heater_fan electronics_fan_left]
# Controller fan - FAN0
pin: PA8
kick_start_time: 0.5
heater: heater_bed, extruder
heater_temp: 50
fan_speed: 0.35

[heater_fan electronics_fan_right]
# Controller fan - FAN1
pin: PE5
kick_start_time: 0.5
heater: heater_bed, extruder
heater_temp: 50
fan_speed: 0.35

# Nevermore fans — converted from [heater_fan] to [fan_generic] so macros
# can control speed independently and keep them running post-print for
# VOC filtering until the hotend cools. NEVERMORE_AUTO in macros.cfg
# sets speed based on bed temp. PRINT_END waits for cooldown then stops them.
[fan_generic nevermore_left]
pin: PD12
max_power: 1.0
shutdown_speed: 0.0
kick_start_time: 1.0
off_below: 0.1

[fan_generic nevermore_right]
pin: PD13
max_power: 1.0
shutdown_speed: 0.0
kick_start_time: 1.0
off_below: 0.1