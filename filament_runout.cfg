# VORON TRIDENT 250mm — Octopus Pro / EBBCan


[filament_motion_sensor BTT_Filament_Sensor]
detection_length: 25.0
extruder: extruder
switch_pin: ^PG15
pause_on_runout: False
runout_gcode:
    M117 Runout Detected!
    # Ported from 2.4 — relieve nozzle pressure before pausing.
    # Guards against cold extrusion error if runout fires during cooldown.
    {% if printer.extruder.temperature >= printer.configfile.settings.extruder.min_extrude_temp %}
        G91
        G1 E-5 F300
        G90
    {% endif %}
    PAUSE
insert_gcode:
    M117 Insert Detected
# Explicit defaults — prevents behavior change if Klipper defaults shift
event_delay: 3.0
pause_delay: 0.5
