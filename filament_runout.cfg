# VORON TRIDENT 250mm — Octopus Pro / EBBCan


[filament_motion_sensor BTT_Filament_Sensor]
detection_length: 25.0
extruder: extruder
switch_pin: ^PG15
pause_on_runout: False
runout_gcode:
    M117 Runout Detected!
    # No extra retract here: Mainsail's PAUSE retracts 1 mm and RESUME pushes the same 1 mm back.
    # A separate retract (was 5 mm) isn't undone on resume and left an empty line after it.
    PAUSE
insert_gcode:
    M117 Insert Detected
# Explicit defaults — prevents behavior change if Klipper defaults shift
event_delay: 3.0
pause_delay: 0.5
