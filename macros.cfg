# VORON TRIDENT 250mm — Octopus Pro / EBBCan


#####################################################################
#
#  macros.cfg — Voron Trident 250mm
#  Machine-specific macros only.
#  All shared logic lives in common_macros.cfg (included first).
#
#  Defines:
#    _LEVEL_BED           → SMART_ZTILT (Z_TILT_ADJUST, 3-point)
#    _ON_PAUSE            → WLED pause state + SB LED
#    _ON_RESUME           → WLED on + SB LED
#    _RESET_SESSION_FLAGS → clears SMART_ZTILT + SMART_MESH variables
#    NEVERMORE_AUTO       → dual fan_generic (nevermore_left, nevermore_right)
#    NEVERMORE_OFF        → dual fan off
#    SMART_ZTILT          → session-reuse Z_TILT_ADJUST
#    Z_TILT_ADJUST        → WLED wrapper around the Klipper built-in
#    WAIT_FRAME_STABLE    → poll frame sensors until thermally even
#    ZERO_TOUCH_PREP      → Trident override — adds frame stability check
#
#####################################################################


#####################################################################
# Bed Leveling — Z_TILT (Trident: 3 leadscrews)
#####################################################################

[gcode_macro _LEVEL_BED]
description: Trident bed leveling — calls SMART_ZTILT
gcode:
    SMART_ZTILT

[gcode_macro SMART_ZTILT]
description: Z_TILT_ADJUST with session-based skip
variable_last_ztilt_valid: 0
gcode:
    {% if last_ztilt_valid == 1 %}
        M117 Skipping Z-tilt (done this session)
        RESPOND MSG="SMART_ZTILT: reusing session result"
    {% else %}
        M117 Running Z-tilt
        status_leveling
        WLED_Z
        Z_TILT_ADJUST_ORIG
        WLED_ON
        G28 Z
        SET_GCODE_VARIABLE MACRO=SMART_ZTILT VARIABLE=last_ztilt_valid VALUE=1
    {% endif %}

[delayed_gcode RESET_ZTILT]
initial_duration: 2
gcode:
    SET_GCODE_VARIABLE MACRO=SMART_ZTILT VARIABLE=last_ztilt_valid VALUE=0

# Wrapper preserves WLED feedback when Z_TILT_ADJUST is called manually
[gcode_macro Z_TILT_ADJUST]
rename_existing: Z_TILT_ADJUST_ORIG
description: Z_TILT_ADJUST with WLED feedback
gcode:
    WLED_Z
    Z_TILT_ADJUST_ORIG
    PARKBED
    WLED_ON


#####################################################################
# Session Flag Reset — called by PRINT_END in common_macros.cfg
#####################################################################

[gcode_macro _RESET_SESSION_FLAGS]
description: Reset leveling and mesh session flags after print
gcode:
    SET_GCODE_VARIABLE MACRO=SMART_ZTILT VARIABLE=last_ztilt_valid VALUE=0
    SET_GCODE_VARIABLE MACRO=SMART_MESH  VARIABLE=last_mesh_valid  VALUE=0


#####################################################################
# Frame Stability Check (Trident-specific)
# Polls front/rear frame thermistors until delta <= threshold.
# Uses namespace to short-circuit once stable — Jinja has no break.
#####################################################################

[gcode_macro WAIT_FRAME_STABLE]
description: Poll frame sensors until front/rear are within DELTA degrees
gcode:
    {% set threshold = params.DELTA|default(3)|int %}
    {% set max_wait  = params.MAX_WAIT|default(30)|int %}
    {% set ns = namespace(stable=false) %}
    RESPOND MSG="Waiting for frame stability (delta <= {threshold}C)..."
    {% for i in range(max_wait) %}
        {% if not ns.stable %}
            {% set front = printer["temperature_sensor frame_front"].temperature %}
            {% set rear  = printer["temperature_sensor frame_rear"].temperature %}
            {% set delta = (front - rear)|abs %}
            {% if delta <= threshold %}
                {% set ns.stable = true %}
                RESPOND MSG="Frame stable — front={front}C rear={rear}C delta={delta|round(1)}C"
            {% elif i < max_wait - 1 %}
                RESPOND MSG="Frame not stable yet — delta={delta|round(1)}C — waiting 10s"
                G4 P10000
            {% else %}
                RESPOND MSG="WARNING: Frame stability timeout after {max_wait} checks — proceeding anyway"
            {% endif %}
        {% endif %}
    {% endfor %}


#####################################################################
# ZERO_TOUCH_PREP — Trident override
# Extends common_macros.cfg version with frame stability check.
# Loaded after common_macros.cfg so this definition takes precedence.
#####################################################################

[gcode_macro ZERO_TOUCH_PREP]
description: Bed wait + soak + level + mesh with frame stability check (Trident)
gcode:
    {% set bed_target     = params.BED|default(printer.heater_bed.target)|int %}
    {% set chamber_target = params.CHAMBER|default(0)|int %}

    G90
    status_heating
    M117 Zero-touch prep
    HEALTH_CHECK

    # Bed heat — only wait if more than 5C away
    {% set current_bed = printer.heater_bed.temperature|int %}
    {% if (bed_target - current_bed) > 5 %}
        M117 Heating bed...
        M190 S{bed_target}
    {% else %}
        M117 Bed already at temp
    {% endif %}

    # Temperature soak — only if bed had to heat up significantly
    {% if (bed_target - current_bed) > 5 %}
        {% if bed_target >= 110 %}
            M117 Soaking 5 min (high temp)...
            G4 P300000
        {% elif bed_target >= 90 %}
            M117 Soaking 3 min (mid temp)...
            G4 P180000
        {% elif bed_target >= 60 %}
            M117 Soaking 2 min...
            G4 P120000
        {% else %}
            M117 Soaking 1 min (PLA)...
            G4 P60000
        {% endif %}
    {% else %}
        M117 Bed already at temp — skipping soak
    {% endif %}

    # Chamber air wait
    {% if chamber_target > 0 %}
        M117 Waiting for chamber ({chamber_target}C)...
        TEMPERATURE_WAIT SENSOR="temperature_sensor frame" MINIMUM={chamber_target}
        RESPOND MSG="Chamber air at target — checking frame stability"
    {% endif %}

    # Frame stability check — only when chamber wait ran
    {% if chamber_target > 0 %}
        M117 Checking frame stability...
        WAIT_FRAME_STABLE DELTA=3 MAX_WAIT=30
    {% endif %}

    # Level + mesh
    _LEVEL_BED
    SMART_MESH

    HEALTH_CHECK
    M117 Prep complete


#####################################################################
# Nevermore — dual fan_generic (left + right pins)
#####################################################################

[gcode_macro NEVERMORE_AUTO]
description: Set Nevermore speed based on bed target temp
gcode:
    {% if printer.heater_bed.target > 80 %}
        SET_FAN_SPEED FAN=nevermore_left  SPEED=1.0
        SET_FAN_SPEED FAN=nevermore_right SPEED=1.0
    {% else %}
        SET_FAN_SPEED FAN=nevermore_left  SPEED=0.3
        SET_FAN_SPEED FAN=nevermore_right SPEED=0.3
    {% endif %}

[gcode_macro NEVERMORE_OFF]
description: Turn off both Nevermore fans
gcode:
    SET_FAN_SPEED FAN=nevermore_left  SPEED=0.0
    SET_FAN_SPEED FAN=nevermore_right SPEED=0.0


#####################################################################
# Pause / Resume light hooks — Trident uses WLED
#####################################################################

[gcode_macro _ON_PAUSE]
description: Trident pause state — WLED + SB LED
gcode:
    WLED_PAUSE
    status_busy

[gcode_macro _ON_RESUME]
description: Trident resume state — WLED on + SB LED
gcode:
    WLED_ON
    status_printing


#####################################################################
# Utility
# DEBUG_TEMP lives in common_macros.cfg — shared across both printers
#####################################################################
