# VORON TRIDENT 250mm — Octopus Pro / EBBCan


#####################################################################
# Bed Leveling — Z_TILT (Trident: 3 leadscrews)
#####################################################################

[gcode_macro _LEVEL_BED]
description: Trident bed leveling — calls SMART_ZTILT
gcode:
    SMART_ZTILT

[gcode_macro SMART_ZTILT]
description: Z_TILT_ADJUST with session-based skip
variable_last_ztilt_valid: 0
gcode:
    {% if last_ztilt_valid == 1 and "z" in printer.toolhead.homed_axes %}
        M117 Skipping Z-tilt (done this session)
        RESPOND MSG="SMART_ZTILT: reusing session result"
    {% else %}
        M117 Running Z-tilt
        status_leveling
        WLED_Z
        Z_TILT_ADJUST_ORIG
        WLED_ON
        G28 Z
        SET_GCODE_VARIABLE MACRO=SMART_ZTILT VARIABLE=last_ztilt_valid VALUE=1
        RESPOND MSG="SMART_ZTILT: Z-tilt complete"
    {% endif %}

[delayed_gcode RESET_ZTILT]
initial_duration: 2
gcode:
    SET_GCODE_VARIABLE MACRO=SMART_ZTILT VARIABLE=last_ztilt_valid VALUE=0

[gcode_macro Z_TILT_ADJUST]
rename_existing: Z_TILT_ADJUST_ORIG
description: Z_TILT_ADJUST with WLED feedback
gcode:
    WLED_Z
    Z_TILT_ADJUST_ORIG
    PARKBED
    WLED_ON


#####################################################################
# Session Flag Reset — called by PRINT_END in common_macros.cfg
#####################################################################

[gcode_macro _RESET_SESSION_FLAGS]
description: Reset leveling and mesh session flags after print
gcode:
    SET_GCODE_VARIABLE MACRO=SMART_ZTILT VARIABLE=last_ztilt_valid VALUE=0
    SET_GCODE_VARIABLE MACRO=SMART_MESH  VARIABLE=last_mesh_valid VALUE=0


#####################################################################
# Nevermore — dual fan_generic (left + right pins)
#####################################################################

[gcode_macro NEVERMORE_AUTO]
description: Set Nevermore speed based on bed target temp
gcode:
    {% if printer.heater_bed.target > 80 %}
        SET_FAN_SPEED FAN=nevermore_left  SPEED=1.0
        SET_FAN_SPEED FAN=nevermore_right SPEED=1.0
    {% else %}
        SET_FAN_SPEED FAN=nevermore_left  SPEED=0.3
        SET_FAN_SPEED FAN=nevermore_right SPEED=0.3
    {% endif %}

[gcode_macro NEVERMORE_OFF]
description: Turn off both Nevermore fans
gcode:
    SET_FAN_SPEED FAN=nevermore_left  SPEED=0.0
    SET_FAN_SPEED FAN=nevermore_right SPEED=0.0


#####################################################################
# Pause / Resume light hooks — Trident uses WLED
#####################################################################

[gcode_macro _ON_PAUSE]
description: Trident pause state — WLED + SB LED
gcode:
    WLED_PAUSE
    status_busy

[gcode_macro _ON_RESUME]
description: Trident resume state — WLED on + SB LED
gcode:
    WLED_ON
    status_printing

[gcode_macro _ON_CANCEL]
description: Trident cancel state — WLED off + SB LED idle
gcode:
    WLED_OFF
    status_ready


#####################################################################
# Auto Mode — accel based on print footprint
# Ceilings reflect 2026-05-19 ShakeTune: X EI 77.6Hz, Y MZV 42.6Hz
# max_accel: 5000 (Y-limited). Scale down for larger footprints
# to reduce ringing on bigger prints.
#####################################################################

[gcode_macro AUTO_MODE]
description: Set accel based on overall print footprint (all objects, correct polygon structure)
gcode:
    {% if printer.exclude_object.objects|length > 0 %}
        {% set ns = namespace(min_x=9999, min_y=9999, max_x=0, max_y=0) %}
        {% for obj in printer.exclude_object.objects %}
            {% for pt in obj.polygon %}
                {% if pt[0] < ns.min_x %}{% set ns.min_x = pt[0] %}{% endif %}
                {% if pt[1] < ns.min_y %}{% set ns.min_y = pt[1] %}{% endif %}
                {% if pt[0] > ns.max_x %}{% set ns.max_x = pt[0] %}{% endif %}
                {% if pt[1] > ns.max_y %}{% set ns.max_y = pt[1] %}{% endif %}
            {% endfor %}
        {% endfor %}
        {% set size = [(ns.max_x - ns.min_x), (ns.max_y - ns.min_y)]|max %}
        {% if size < 100 %}
            SET_VELOCITY_LIMIT ACCEL=5000
        {% elif size < 200 %}
            SET_VELOCITY_LIMIT ACCEL=4000
        {% else %}
            SET_VELOCITY_LIMIT ACCEL=3000
        {% endif %}
        RESPOND MSG="AUTO_MODE: footprint {size|round(0)}mm accel set"
    {% else %}
        SET_VELOCITY_LIMIT ACCEL=5000
    {% endif %}


#####################################################################
# Utility
# DEBUG_TEMP lives in common_macros.cfg — shared across both printers
#####################################################################

[gcode_macro WATCH_PRINT]
description: Manual temp sanity check — call from console only
gcode:
    {% if printer.extruder.temperature < printer.extruder.target - 20 %}
        RESPOND TYPE=error MSG="Temp drop: {printer.extruder.temperature}C vs target {printer.extruder.target}C"
        PAUSE
        M117 Temp drop detected
    {% endif %}
