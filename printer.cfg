# Voron Trident 250mm — BigTreeTech Octopus Pro — TMC5160 (XY) / TMC2209 (Z)
# Updated: sync with Voron 2.4 config baseline

#OCTOPUS PRO firmware settings:
#STM32F446
#BOOTLOADER OFFSET 34KiB
#CLOCK REFERENCE 12MHz crystal
#USB on PA11/PA12



[include mainsail.cfg]
[include thermistor.cfg]
[include fans.cfg]
[include bed_heater.cfg]
[include EBBCan.cfg]
[include wled.cfg]
[include common_macros.cfg]
[include macros.cfg]
[include stealthburner_leds.cfg]
[include probe.cfg]
[include filament_runout.cfg]
[include config_backup.cfg]
[include temperature_color.cfg]


#####################################################################
# Mainsail Client Variables — customizes PAUSE/RESUME/CANCEL_PRINT
#####################################################################

[gcode_macro _CLIENT_VARIABLE]
variable_use_custom_pos:    True
variable_custom_park_x:     127.5
variable_custom_park_y:     5.0
variable_custom_park_dz:    10.0
variable_retract:           1.0
variable_cancel_retract:    5.0
variable_speed_retract:     35.0
variable_unretract:         1.0
variable_speed_unretract:   35.0
variable_speed_hop:         15.0
variable_speed_move:        100.0
variable_park_at_cancel:    True
variable_park_at_cancel_x:  245.0
variable_park_at_cancel_y:  245.0
variable_idle_timeout:      43200
variable_user_pause_macro:  "_ON_PAUSE"
variable_user_resume_macro: "_ON_RESUME"
variable_user_cancel_macro: "_ON_RESUME"
gcode:

[shaketune]
[gcode_arcs]
[exclude_object]

[idle_timeout]
timeout: 7200


#####################################################################
#  MCU
#####################################################################


[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32f446xx_19002D001350565843333620-if00
restart_method: command


#####################################################################
#   Printer
#####################################################################

[printer]
kinematics: corexy
max_velocity: 300
max_accel: 3500             # EI 50.2Hz Y axis — safe ceiling per Shaketune
max_z_velocity: 15          # T8 leadscrew mechanical limit
max_z_accel: 350
square_corner_velocity: 5.0


#####################################################################
# Input Shaper
#####################################################################

[input_shaper]
shaper_type_x: mzv
shaper_freq_x: 55.0
damping_ratio_x: 0.053

shaper_type_y: ei
shaper_freq_y: 50.2
damping_ratio_y: 0.053


#####################################################################
#   Autotune
#####################################################################

[autotune_tmc stepper_x]
motor: ldo-42sth48-2504ah
voltage: 48

[autotune_tmc stepper_y]
motor: ldo-42sth48-2504ah
voltage: 48                 # FIX: was missing — was autotuning at wrong voltage

# Uncomment and verify motor model before enabling Z autotune
[autotune_tmc stepper_z]
motor: ldo-42sth40-1684l300e
voltage: 24

[autotune_tmc stepper_z1]
motor: ldo-42sth40-1684l300e
voltage: 24

[autotune_tmc stepper_z2]
motor: ldo-42sth40-1684l300e
voltage: 24


#####################################################################
#   X/Y Stepper Settings
#####################################################################

##  B Stepper - Left — MOTOR_0
[stepper_x]
step_pin: PF13
dir_pin: PF12
enable_pin: !PF14
rotation_distance: 40
microsteps: 32
full_steps_per_rotation: 200
endstop_pin: EBBCan: PB6
position_min: 0
position_endstop: 255
position_max: 255
homing_speed: 75
homing_retract_dist: 5
homing_positive_dir: true

[tmc5160 stepper_x]
cs_pin: PC4
spi_software_mosi_pin: PA7
spi_software_miso_pin: PA6
spi_software_sclk_pin: PA5
interpolate: true
run_current: 1.5
sense_resistor: 0.075
#stealthchop_threshold: 0

##  A Stepper - Right — MOTOR_2
[stepper_y]
step_pin: PF11
dir_pin: PG3
enable_pin: !PG5
rotation_distance: 40
microsteps: 32
full_steps_per_rotation: 200
endstop_pin: PG9
position_min: 0
position_endstop: 255
position_max: 255
homing_speed: 75
homing_retract_dist: 5
homing_positive_dir: true

[tmc5160 stepper_y]
cs_pin: PC6
spi_software_mosi_pin: PA7
spi_software_miso_pin: PA6
spi_software_sclk_pin: PA5
interpolate: true
run_current: 1.5
sense_resistor: 0.075
#stealthchop_threshold: 0


#####################################################################
#   Z Stepper Settings
#####################################################################

##  Z0 - Front Left — MOTOR_4
[stepper_z]
step_pin: PF9
dir_pin: !PF10
enable_pin: !PG2
rotation_distance: 4
microsteps: 32
endstop_pin: probe:z_virtual_endstop
position_max: 230
position_min: -2.5
homing_speed: 8.0
second_homing_speed: 3
homing_retract_dist: 3

[tmc2209 stepper_z]
uart_pin: PF2
interpolate: true
run_current: 0.6
sense_resistor: 0.110
#stealthchop_threshold: 0

##  Z1 - Rear Center — MOTOR_5
[stepper_z1]
step_pin: PC13
dir_pin: !PF0
enable_pin: !PF1
rotation_distance: 4
microsteps: 32

[tmc2209 stepper_z1]
uart_pin: PE4
interpolate: true
run_current: 0.6
sense_resistor: 0.110
#stealthchop_threshold: 0

##  Z2 - Front Right — MOTOR_6
[stepper_z2]
step_pin: PE2
dir_pin: !PE3
enable_pin: !PD4
rotation_distance: 4
microsteps: 32

[tmc2209 stepper_z2]
uart_pin: PE1
interpolate: true
run_current: 0.6
sense_resistor: 0.110
#stealthchop_threshold: 0


#####################################################################
#   Bed Mesh
#####################################################################

[bed_mesh]
mesh_min: 10, 10
mesh_max: 240, 240
speed: 300
horizontal_move_z: 10
probe_count: 5, 5
adaptive_margin: 5
algorithm: bicubic
fade_start: 1
fade_end: 10
fade_target: 0
move_check_distance: 3
split_delta_z: 0.0125
mesh_pps: 4, 4
bicubic_tension: 0.2


#####################################################################
#   Homing and Gantry Adjustment
#####################################################################

[homing_override]
axes: z
set_position_z: 0
gcode:
    G90
    status_homing
    G0 Z5 F600
    G28 X Y
    G0 X127 Y127 F18000     # consistent center — matches resonance_tester probe_points
    G28 Z
    G0 Z10 F3600
    G0 X127 Y127 F18000
    status_ready

[z_tilt]
z_positions:
    -50, 18
    125, 298
    300, 18
points:
    30, 5
    125, 195
    220, 5
speed: 300
horizontal_move_z: 10
retries: 5
retry_tolerance: 0.0075



[verify_heater extruder]
max_error: 100
check_gain_time: 20
hysteresis: 3
heating_gain: 2

# Firmware retraction — enable if Orca is configured to use G10/G11.
# If using slicer-controlled retraction, comment this section out
# to avoid double-retracts.
#[firmware_retraction]
#retract_length: 0.5
#retract_speed: 35
#unretract_extra_length: 0
#unretract_speed: 35

